name: maniskill_spectrum
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # Simulation (RQ1-RQ3, RQ4b regeneration). ManiSkill resolves its own
      # torch / sapien / gymnasium versions.
      - mani_skill==3.0.1
      # Numerical / analysis stack verified for this release.
      - numpy>=1.26,<2
      - scipy>=1.11
      - pandas>=2.0
      - matplotlib>=3.8
      - h5py>=3.10
      - scikit-learn>=1.4
      - threadpoolctl
      - transforms3d
      - IPython
